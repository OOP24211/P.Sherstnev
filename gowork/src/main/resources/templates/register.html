<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>GoWork — Регистрация</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0d0d12;
            --surface: #16161f;
            --border: #2a2a38;
            --accent: #7c6ef5;
            --accent2: #e85d8a;
            --text: #e8e8f0;
            --muted: #6b6b80;
            --success: #3ecf8e;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 80% 60% at 80% 50%, rgba(232,93,138,0.1) 0%, transparent 60%),
                radial-gradient(ellipse 60% 80% at 20% 80%, rgba(124,110,245,0.08) 0%, transparent 60%);
            pointer-events: none;
        }

        .grid-bg {
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 48px 48px;
            pointer-events: none;
        }

        .card {
            position: relative;
            z-index: 1;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 48px 40px;
            width: 400px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: var(--muted);
            text-decoration: none;
            margin-bottom: 32px;
            transition: color 0.2s;
        }

        .back-btn:hover { color: var(--text); }

        .card-title {
            font-family: 'Syne', sans-serif;
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 6px;
        }

        .card-title span {
            background: linear-gradient(135deg, var(--accent2), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .card-sub {
            color: var(--muted);
            font-size: 14px;
            margin-bottom: 32px;
        }

        .error-banner {
            background: rgba(232,93,138,0.1);
            border: 1px solid rgba(232,93,138,0.2);
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 20px;
            font-size: 13px;
            color: var(--accent2);
        }

        .field { margin-bottom: 18px; }

        label {
            display: block;
            font-size: 11px;
            font-weight: 500;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.6px;
            margin-bottom: 8px;
        }

        input {
            display: block;
            width: 100%;
            padding: 13px 16px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
        }

        input::placeholder { color: var(--muted); }

        .btn-primary {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, var(--accent2), #c2486e);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            margin-top: 8px;
            transition: opacity 0.2s, transform 0.1s;
            letter-spacing: 0.3px;
        }

        .btn-primary:hover { opacity: 0.9; }
        .btn-primary:active { transform: scale(0.99); }
    </style>
</head>
<body>
<div class="grid-bg"></div>

<div class="card">
    <a href="/" class="back-btn">← Назад</a>

    <div class="card-title">Создать <span>аккаунт</span></div>
    <div class="card-sub">Регистрация займёт 10 секунд</div>

    <div class="error-banner" th:if="${error}" th:text="${error}"></div>

    <form action="/register" method="post">
        <div class="field">
            <label>Ваше имя</label>
            <input type="text" name="name" placeholder="Как вас зовут?" required>
        </div>
        <div class="field">
            <label>Email</label>
            <input type="email" name="email" placeholder="example@mail.com" required>
        </div>
        <button type="submit" class="btn-primary">Зарегистрироваться →</button>
    </form>
</div>
</body>
</html>
